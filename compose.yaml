services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scouting
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - scouting_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U scout -d scouting"]
      interval: 3s
      timeout: 3s
      retries: 30
  import:
    build: .
    environment: &database
      DATABASE_URL: postgresql://scout:${POSTGRES_PASSWORD}@db/scouting
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./External Files:/data:ro
      - ../transfermarkt-scraper/samples:/samples:ro
    command: ["python","-m","scouting.ingest","--data","/data","--market","/samples/players.json"]
  api:
    build: .
    environment: *database
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      import:
        condition: service_completed_successfully
volumes:
  scouting_data:
